services:

  app:
    build: .
    container_name: wanderlust-app
    ports:
      - "8181:8181"
    environment:
      PORT: 8181
      MONGO_URL: mongodb://mongo:27017/wanderlust
      SESSION_SECRET: mysupersecretcode
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: wanderlust-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data: